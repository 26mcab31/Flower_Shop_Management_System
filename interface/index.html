<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flower Shop - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe0ec, #fff5f8);
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .flower-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #c2185b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #c2185b;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #c2185b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #ad1457;
        }

        #message {
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="flower-icon">🌸</div>

        <h1>Flower Shop</h1>

        <p class="subtitle">Management System</p>

        <form onsubmit="login(event)">

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        function login(event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === "admin" && password === "1234") {

                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText =
                    "Login successful!";

                setTimeout(function () {
                    window.location.href = "dashboard.html";
                }, 1000);

            } else {

                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerText =
                    "Invalid username or password!";

            }
        }

    </script>

</body>

</html>
